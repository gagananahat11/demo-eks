name: CI/CD -> ECR & EKS (Helm)


on:
push:
branches: [ "main" ]


env:
AWS_REGION: us-east-1
ECR_REPOSITORY: demo-app-repo
IMAGE_TAG: ${{ github.sha }}


jobs:
build-and-deploy:
runs-on: ubuntu-latest


permissions:
id-token: write
contents: read


steps:
- name: Checkout
uses: actions/checkout@v4


- name: Configure AWS credentials (OIDC)
uses: aws-actions/configure-aws-credentials@v3
with:
role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-oidc-role
aws-region: ${{ env.AWS_REGION }}


- name: Login to Amazon ECR
uses: aws-actions/amazon-ecr-login@v1


- name: Build, tag, and push image to ECR
env:
ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
run: |
aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} || aws ecr create-repository --repository-name ${{ env.ECR_REPOSITORY }}
docker build --build-arg BUILD_VERSION=${{ env.IMAGE_TAG }} --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} .
docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}


- name: Update kubeconfig for EKS
run: |
aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}


- name: Deploy via Helm
run: |
helm upgrade --install demo-app ./chart \
--set image.repository=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }} \
--set image.tag=${{ env.IMAGE_TAG }} \
--set namespace=demo-app \
--create-namespace


- name: Get service info
run: |
kubectl -n demo-app get svc demo-app -o wide